# Live2D 项目：官方 Plus / BeefAPI 共用 Profile。
# 用法：scripts/codex-live2d
#
# 主 Agent 的模型和 Effort 由 Codex 界面的 /model 选择，这里不锁定。
# 本文件只固定子 Agent 默认值，避免它们继承主 Agent 的选择。
# Provider 和认证仍由 CC Switch 当前线路决定。

[agents]
default_subagent_model = "gpt-6-astra"
default_subagent_reasoning_effort = "medium"

[tui]
screen_reader_detection_done = true
